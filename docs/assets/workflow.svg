<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">onmhj workflow</title>
  <desc id="desc">Static workflow diagram for capture, queue, flush, and retry stages.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 32px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane-label { fill: #334155; font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
      .card-capture { stroke: #14b8a6; }
      .card-queue { stroke: #6366f1; }
      .card-flush { stroke: #f59e0b; }
      .card-done { stroke: #22c55e; }
      .card-fail { stroke: #ef4444; }
      .card-title { fill: #0f172a; font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-text { fill: #475569; font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chip { fill: #eef2ff; stroke: #c7d2fe; }
      .chip-text { fill: #4338ca; font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 7 7; }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="800"/>
  <text class="title" x="64" y="64">onmhj workflow</text>
  <text class="subtitle" x="64" y="92">Capture locally, merge across devices, publish daily reports, retry until confirmed.</text>

  <rect class="lane" x="48" y="126" width="354" height="590" rx="20"/>
  <rect class="lane" x="462" y="126" width="354" height="590" rx="20"/>
  <rect class="lane" x="876" y="126" width="354" height="590" rx="20"/>

  <text class="lane-label" x="76" y="158">CAPTURE</text>
  <text class="lane-label" x="490" y="158">QUEUE</text>
  <text class="lane-label" x="904" y="158">FLUSH + CONFIRM</text>

  <rect class="card card-capture" x="86" y="192" width="278" height="92" rx="14"/>
  <text class="card-title" x="114" y="228">Codex / Claude Code</text>
  <text class="card-text" x="114" y="254">SessionStart and prompt hooks</text>

  <rect class="card card-capture" x="86" y="334" width="278" height="98" rx="14"/>
  <text class="card-title" x="114" y="370">Redact prompt fields</text>
  <text class="card-text" x="114" y="396">Best-effort secret scrubbing</text>

  <rect class="card card-capture" x="86" y="482" width="278" height="112" rx="14"/>
  <text class="card-title" x="114" y="518">Local JSONL spool</text>
  <text class="card-text" x="114" y="544">~/.local/state/onmhj/events</text>
  <text class="small" x="114" y="568">UTC files, configured local date</text>

  <rect class="chip" x="118" y="620" width="214" height="34" rx="12"/>
  <text class="chip-text" x="140" y="642">Manual backfill: inject/import</text>

  <rect class="card card-queue" x="500" y="192" width="278" height="104" rx="14"/>
  <text class="card-title" x="528" y="228">Confirmed floor</text>
  <text class="card-text" x="528" y="254">local confirmed.json</text>
  <text class="card-text" x="528" y="276">state/devices/*.json</text>

  <rect class="card card-queue" x="500" y="350" width="278" height="104" rx="14"/>
  <text class="card-title" x="528" y="386">Enqueue open dates</text>
  <text class="card-text" x="528" y="412">Every date after the floor</text>
  <text class="small" x="528" y="434">Runs on SessionStart</text>

  <rect class="card card-queue" x="500" y="510" width="278" height="104" rx="14"/>
  <text class="card-title" x="528" y="546">Background worker</text>
  <text class="card-text" x="528" y="572">Detached onmhj worker</text>
  <text class="small" x="528" y="594">Oldest pending date first</text>

  <rect class="card card-flush" x="914" y="176" width="278" height="104" rx="14"/>
  <text class="card-title" x="942" y="212">Pull report repo</text>
  <text class="card-text" x="942" y="238">Fetch latest raw and state</text>
  <text class="small" x="942" y="260">Multi-device safe</text>

  <rect class="card card-flush" x="914" y="324" width="278" height="120" rx="14"/>
  <text class="card-title" x="942" y="360">Merge and dedupe</text>
  <text class="card-text" x="942" y="386">raw/ai-sessions/YYYY-MM-DD.jsonl</text>
  <text class="card-text" x="942" y="410">daily/YYYY-MM-DD.md</text>

  <rect class="card card-flush" x="914" y="486" width="278" height="84" rx="14"/>
  <text class="card-title" x="942" y="520">Commit and push</text>
  <text class="card-text" x="942" y="546">Publish generated report files</text>

  <rect class="card card-done" x="910" y="626" width="136" height="66" rx="14"/>
  <text class="card-title" x="978" y="656" text-anchor="middle">Success</text>
  <text class="small" x="978" y="676" text-anchor="middle">advance floor</text>

  <rect class="card card-fail" x="1060" y="626" width="136" height="66" rx="14"/>
  <text class="card-title" x="1128" y="656" text-anchor="middle">Failure</text>
  <text class="small" x="1128" y="676" text-anchor="middle">retry later</text>

  <path class="line" d="M225 284 L225 330"/>
  <path class="line" d="M225 432 L225 478"/>
  <path class="line-soft" d="M332 637 L350 637 C426 637 414 402 470 402 L496 402"/>

  <path class="line" d="M364 538 C420 538 430 402 496 402"/>
  <path class="line" d="M639 296 L639 346"/>
  <path class="line" d="M639 454 L639 506"/>

  <path class="line" d="M778 562 C840 562 830 228 870 228 L910 228"/>
  <path class="line" d="M1053 280 L1053 320"/>
  <path class="line" d="M1053 444 L1053 482"/>
  <path class="line" d="M1008 570 L990 622"/>
  <path class="line" d="M1102 570 L1120 622"/>
  <path class="line-soft" d="M1128 692 L1128 722 C1128 730 1120 734 1112 734 L930 734 C904 734 890 712 890 686 L890 612 C890 596 884 584 868 584 L780 584"/>

</svg>
