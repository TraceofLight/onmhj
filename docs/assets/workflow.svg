<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
  <title id="title">onmhj workflow</title>
  <desc id="desc">Capture and normalize AI-session evidence, publish raw-only updates when requested, process eligible report dates in order, validate generated reports, and confirm dates only after publication succeeds.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 32px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane-label { fill: #334155; font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
      .card-capture { stroke: #14b8a6; }
      .card-queue { stroke: #6366f1; }
      .card-report { stroke: #f59e0b; }
      .card-done { stroke: #22c55e; }
      .card-fail { stroke: #ef4444; }
      .card-title { fill: #0f172a; font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-text { fill: #475569; font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 7 7; }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="950"/>
  <text class="title" x="64" y="64">onmhj workflow</text>
  <text class="subtitle" x="64" y="92">Normalize canonical evidence, process report dates in order, and publish only validated results.</text>

  <rect class="lane" x="48" y="126" width="354" height="790" rx="20"/>
  <rect class="lane" x="462" y="126" width="354" height="790" rx="20"/>
  <rect class="lane" x="876" y="126" width="354" height="790" rx="20"/>

  <text class="lane-label" x="76" y="158">CAPTURE + RAW</text>
  <text class="lane-label" x="490" y="158">SCHEDULE</text>
  <text class="lane-label" x="904" y="158">GENERATE + PUBLISH</text>

  <rect class="card card-capture" x="86" y="184" width="278" height="90" rx="14"/>
  <text class="card-title" x="114" y="218">Hooks + transcripts</text>
  <text class="card-text" x="114" y="243">Lifecycle events and canonical turns</text>
  <text class="small" x="114" y="262">Codex · Claude Code · import</text>

  <rect class="card card-capture" x="86" y="324" width="278" height="100" rx="14"/>
  <text class="card-title" x="114" y="358">Normalize + redact</text>
  <text class="card-text" x="114" y="384">Canonical AISessionTurn records</text>
  <text class="small" x="114" y="406">Cursor · replay · quarantine on failure</text>

  <rect class="card card-capture" x="86" y="474" width="278" height="110" rx="14"/>
  <text class="card-title" x="114" y="508">Local JSONL spool</text>
  <text class="card-text" x="114" y="534">~/.local/state/onmhj/events</text>
  <text class="small" x="114" y="558">UTC files · configured local work date</text>

  <rect class="card card-report" x="86" y="654" width="278" height="110" rx="14"/>
  <text class="card-title" x="114" y="688">Optional raw-only publish</text>
  <text class="card-text" x="114" y="714">sessions --publish / flush</text>
  <text class="small" x="114" y="738">Raw only · no report or confirmation</text>

  <rect class="card card-queue" x="500" y="184" width="278" height="100" rx="14"/>
  <text class="card-title" x="528" y="218">Report triggers</text>
  <text class="card-text" x="528" y="244">SessionStart when autoReport=true</text>
  <text class="small" x="528" y="266">or explicit /ejmhj [date]</text>

  <rect class="card card-queue" x="500" y="364" width="278" height="120" rx="14"/>
  <text class="card-title" x="528" y="398">Select eligible dates</text>
  <text class="card-text" x="528" y="424">Evidence dates through yesterday</text>
  <text class="card-text" x="528" y="448">Missing or invalid final reports</text>
  <text class="small" x="528" y="470">Local + device confirmation watermarks</text>

  <rect class="card card-queue" x="500" y="574" width="278" height="110" rx="14"/>
  <text class="card-title" x="528" y="608">Ordered worker</text>
  <text class="card-text" x="528" y="634">Oldest pending date first</text>
  <text class="small" x="528" y="658">Later dates wait behind an earlier retry</text>

  <rect class="card card-report" x="914" y="184" width="278" height="100" rx="14"/>
  <text class="card-title" x="942" y="218">Pull + merge in memory</text>
  <text class="card-text" x="942" y="244">Report repo raw + local events</text>
  <text class="small" x="942" y="266">No new raw or report written yet</text>

  <rect class="card card-report" x="914" y="324" width="278" height="130" rx="14"/>
  <text class="card-title" x="942" y="358">Chunk map + final reduce</text>
  <text class="card-text" x="942" y="384">20 KiB record-safe parts</text>
  <text class="card-text" x="942" y="408">Up to 3 maps · one part retry + cache</text>
  <text class="small" x="942" y="432">All valid summaries enter one reducer</text>

  <rect class="card card-report" x="914" y="494" width="278" height="120" rx="14"/>
  <text class="card-title" x="942" y="528">Validate before writing</text>
  <text class="card-text" x="942" y="554">Task shape + every evidence ID</text>
  <text class="card-text" x="942" y="578">Preserve prior report lines</text>
  <text class="small" x="942" y="600">Rejected output changes no artifacts</text>

  <rect class="card card-report" x="914" y="654" width="278" height="90" rx="14"/>
  <text class="card-title" x="942" y="688">Write, commit, push</text>
  <text class="card-text" x="942" y="714">raw + report + device confirmation</text>
  <text class="small" x="942" y="732">One git commit, then push</text>

  <rect class="card card-done" x="910" y="820" width="136" height="62" rx="14"/>
  <text class="card-title" x="978" y="848" text-anchor="middle">Success</text>
  <text class="small" x="978" y="868" text-anchor="middle">advance floor</text>

  <rect class="card card-fail" x="1060" y="820" width="136" height="62" rx="14"/>
  <text class="card-title" x="1128" y="848" text-anchor="middle">Failure</text>
  <text class="small" x="1128" y="868" text-anchor="middle">retry later</text>

  <path class="line" d="M225 274 L225 320"/>
  <path class="line" d="M225 424 L225 470"/>
  <path class="line" d="M225 584 L225 650"/>

  <path class="line" d="M639 284 L639 360"/>
  <path class="line" d="M639 484 L639 570"/>
  <path class="line-soft" d="M364 529 C432 529 426 424 496 424"/>

  <path class="line" d="M778 629 H850 V234 H910"/>
  <path class="line" d="M1053 284 L1053 320"/>
  <path class="line" d="M1053 454 L1053 490"/>
  <path class="line" d="M1053 614 L1053 650"/>
  <path class="line" d="M1018 744 L990 816"/>
  <path class="line" d="M1088 744 L1118 816"/>
</svg>
