description = "Configure, collect, inspect, or publish the onmhj AI-session worklog"
prompt = "Run the installed onmhj CLI with {{args}}, then report its output concisely. Resolve the plugin root from CODEX_PLUGIN_ROOT, then CLAUDE_PLUGIN_ROOT, then ONMHJ_ROOT. Run `\"$PLUGIN_ROOT/bin/onmhj-node\" \"$PLUGIN_ROOT/bin/onmhj.js\" {{args}}`. Do not invent unsupported aliases. If no arguments were supplied, run status. Before sessions --publish or flush, state that it commits and pushes the registered report repository unless --no-push was supplied."
